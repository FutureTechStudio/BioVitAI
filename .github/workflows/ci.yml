name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils curl ca-certificates postgresql-common
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        run: |
          choco install poppler --version=26.9.0 -y --no-progress
          $popplerInfo = Get-ChildItem "$env:ChocolateyInstall/lib/poppler" -Recurse -Filter pdfinfo.exe | Select-Object -First 1
          if (-not $popplerInfo) { throw 'Poppler client utilities unavailable' }
          $popplerInfo.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
      - if: runner.os == 'Windows'
        run: npm run setup:backup
      - run: npm run check
      - run: npm run build:web
      - run: npm run test:db
      - run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python documentation/BiovitAI-Documentation-v2.1/tools/validate_package.py
      - run: python tools/validate-tracker.py
  browser:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        community: ['on', 'off']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - if: matrix.community == 'on'
        run: npm run test:web:isolated
      - if: matrix.community == 'off'
        run: npm run test:web:community-off
